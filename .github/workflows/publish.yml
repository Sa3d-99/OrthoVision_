name: Publish Windows installer

on:
  push:
    branches: [main]
    paths: [VERSION.txt, SHA256SUMS, 'OrthoVision-Setup-*.exe', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-installer
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Sa3d-99/OrthoVision_'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Publication step failed::Command failed at line $LINENO: $BASH_COMMAND"' ERR
          version="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          name="OrthoVision-Setup-$version.exe"
          installer="$name"
          test -f "$installer"
          sha256sum --check SHA256SUMS
          expected_hash="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          expected_size="$(stat -c %s "$installer")"
          test "$expected_size" -gt 0
          test "$expected_size" -le 268435456
          releases="$(gh api "repos/$RELEASE_REPOSITORY/releases?per_page=100")"
          published="$(jq -c --arg tag "$tag" '[.[] | select(.tag_name == $tag and .draft == false)] | sort_by(.id) | last // empty' <<< "$releases")"
          replace_id=''
          if test -n "$published"; then
            current_hash="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$published")"
            if test "$current_hash" != "sha256:$expected_hash"; then
              test -f REPLACE_RELEASE.txt
            old_hash="$(tr -d '\r\n' < REPLACE_RELEASE.txt)"
            [[ "$old_hash" =~ ^[a-f0-9]{64}$ ]]
              test "$(jq '.assets | length' <<< "$published")" = 1
              test "$current_hash" = "sha256:$old_hash"
              replace_id="$(jq -r .id <<< "$published")"
              [[ "$replace_id" =~ ^[0-9]+$ ]]
            fi
          fi
          # Several drafts can share a tag. Reuse only an exact matching asset;
          # never identify the upload or publication target by tag alone.
          release="$(jq -c --arg tag "$tag" --arg name "$name" --arg hash "sha256:$expected_hash" --argjson size "$expected_size" '[.[] | select(.tag_name == $tag and any(.assets[]; .name == $name and .digest == $hash and .size == $size))] | sort_by(.id) | last // empty' <<< "$releases")"
          if test -z "$release"; then
            release="$(gh api --method POST "repos/$RELEASE_REPOSITORY/releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="OrthoVision $version" -F draft=true -F prerelease=false -f body="$(< RELEASE_NOTES.md)")"
            release_id="$(jq -r .id <<< "$release")"
            [[ "$release_id" =~ ^[0-9]+$ ]]
            gh api --method POST "https://uploads.github.com/repos/$RELEASE_REPOSITORY/releases/$release_id/assets?name=$name" --input "$installer" -H 'Content-Type: application/octet-stream' --silent
            release="$(gh api "repos/$RELEASE_REPOSITORY/releases/$release_id")"
          fi
          release_id="$(jq -r .id <<< "$release")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          test "$(jq -r .tag_name <<< "$release")" = "$tag"
          test "$(jq '.assets | length' <<< "$release")" = 1
          actual_hash="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$release")"
          actual_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<< "$release")"
          echo "::notice::Uploaded SHA-256: $actual_hash; expected sha256:$expected_hash; uploaded size $actual_size; expected $expected_size"
          test "$actual_hash" = "sha256:$expected_hash"
          test "$actual_size" = "$expected_size"
          # Only remove the old publication after the new uploaded asset passes.
          if test -n "$replace_id"; then
            tag_ref="$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$tag")"
            test "$(jq -r .ref <<< "$tag_ref")" = "refs/tags/$tag"
            echo 'Replacing exactly the old published release authorized by checksum.'
            gh api --method DELETE "repos/$RELEASE_REPOSITORY/releases/$replace_id"
            gh api --method DELETE "repos/$RELEASE_REPOSITORY/git/refs/tags/$tag"
          fi
          if test "$(jq -r .draft <<< "$release")" = true; then
            gh api --method PATCH "repos/$RELEASE_REPOSITORY/releases/$release_id" -F draft=false -f make_latest=true -f target_commitish="$GITHUB_SHA" --silent
          fi
          latest="$(gh api "repos/$RELEASE_REPOSITORY/releases/latest")"
          test "$(jq -r .id <<< "$latest")" = "$release_id"
          test "$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$latest")" = "sha256:$expected_hash"
          # One-time, owner-authorized retirement. Never remove the old release
          # until the new licensed installer is published AND verified as latest.
          if test -f REMOVE_RELEASE.txt; then
            test "$version" = '1.0.2'
            read -r retired_tag retired_hash < <(tr -d '\r' < REMOVE_RELEASE.txt)
            test "$retired_tag" = 'v1.0.1'
            [[ "$retired_hash" =~ ^[a-f0-9]{64}$ ]]
            test ! -f 'OrthoVision-Setup-1.0.1.exe'
            retired="$(jq -c '[.[] | select(.tag_name == "v1.0.1" and .draft == false)] | sort_by(.id) | last // empty' <<< "$releases")"
            if test -n "$retired"; then
              retired_id="$(jq -r .id <<< "$retired")"
              [[ "$retired_id" =~ ^[0-9]+$ ]]
              test "$retired_id" != "$release_id"
              test "$(jq '.assets | length' <<< "$retired")" = 1
              test "$(jq -r '.assets[0].name' <<< "$retired")" = 'OrthoVision-Setup-1.0.1.exe'
              test "$(jq -r '.assets[0].digest' <<< "$retired")" = "sha256:$retired_hash"
              gh api --method DELETE "repos/$RELEASE_REPOSITORY/releases/$retired_id"
              echo 'Retired the exact authorized unlicensed v1.0.1 release.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          printf 'Published verified installer: https://github.com/%s/releases/tag/%s\n' "$RELEASE_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
