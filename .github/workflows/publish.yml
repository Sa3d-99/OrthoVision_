name: Publish Windows installer

on:
  push:
    branches: [main]
    paths: [VERSION.txt, SHA256SUMS, 'OrthoVision-Setup-*.exe', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-installer
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Sa3d-99/OrthoVision_'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify installer and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error title=Publication step failed::Command failed at line $LINENO: $BASH_COMMAND"' ERR
          version="$(tr -d '\r\n' < VERSION.txt)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tag="v$version"
          name="OrthoVision-Setup-$version.exe"
          installer="$name"
          test -f "$installer"
          sha256sum --check SHA256SUMS
          expected_hash="$(sha256sum "$installer" | cut -d ' ' -f 1)"
          expected_size="$(stat -c %s "$installer")"
          test "$expected_size" -gt 0
          test "$expected_size" -le 268435456
          releases="$(gh api "repos/$RELEASE_REPOSITORY/releases?per_page=100")"
          release="$(jq -c --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | sort_by(.id) | last // empty' <<< "$releases")"
          if test -n "$release" && test -f REPLACE_RELEASE.txt; then
            old_hash="$(tr -d '\r\n' < REPLACE_RELEASE.txt)"
            [[ "$old_hash" =~ ^[a-f0-9]{64}$ ]]
            current_hash="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$release")"
            if test "$current_hash" != "sha256:$expected_hash"; then
              test "$(jq -r .tag_name <<< "$release")" = "$tag"
              test "$(jq '.assets | length' <<< "$release")" = 1
              test "$current_hash" = "sha256:$old_hash"
              release_id="$(jq -r .id <<< "$release")"
              [[ "$release_id" =~ ^[0-9]+$ ]]
              tag_ref="$(gh api "repos/$RELEASE_REPOSITORY/git/ref/tags/$tag")"
              test "$(jq -r .ref <<< "$tag_ref")" = "refs/tags/$tag"
              echo 'Replacing exactly the old release authorized by the submitted checksum. Existing installations of this version need manual reinstallation.'
              gh api --method DELETE "repos/$RELEASE_REPOSITORY/releases/$release_id"
              gh api --method DELETE "repos/$RELEASE_REPOSITORY/git/refs/tags/$tag"
              release=''
            fi
          fi
          if test -n "$release"; then
            echo 'Verifying existing release; assets will not be overwritten.'
          else
            if ! creation="$(gh release create "$tag" "$installer" --repo "$RELEASE_REPOSITORY" --draft --title "OrthoVision $version" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA" 2>&1)"; then
              echo "::error title=Release creation failed::${creation//$'\n'/'%0A'}"
              exit 1
            fi
            releases="$(gh api "repos/$RELEASE_REPOSITORY/releases?per_page=100")"
            release="$(jq -c --arg tag "$tag" '[.[] | select(.tag_name == $tag)] | sort_by(.id) | last // empty' <<< "$releases")"
            test -n "$release"
          fi
          actual_hash="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<< "$release")"
          actual_size="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<< "$release")"
          echo "::notice::Uploaded SHA-256: $actual_hash; expected sha256:$expected_hash; uploaded size $actual_size; expected $expected_size"
          test "$actual_hash" = "sha256:$expected_hash"
          test "$actual_size" = "$expected_size"
          if test "$(jq -r .draft <<< "$release")" = true; then
            gh release edit "$tag" --repo "$RELEASE_REPOSITORY" --draft=false --latest
          fi
          printf 'Published verified installer: https://github.com/%s/releases/tag/%s\n' "$RELEASE_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
